services:
  mysql:
    image: mysql:8.0
    container_name: cinemabooking-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinemabooking
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cinemabooking
      MYSQL_PASSWORD: cinemabooking
    ports:
      - "3306:3306"
    volumes:
      - cinemabooking_mysql:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    container_name: cinemabooking-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - cinemabooking_redis:/data
volumes:
  cinemabooking_mysql:
  cinemabooking_redis:

