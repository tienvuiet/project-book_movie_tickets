spring:
  application:
    name: cinemabooking-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
server:
  port: 8080
  forward-headers-strategy: framework
app:
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  chat:
    outbox-relay-delay-ms: ${CHAT_OUTBOX_RELAY_DELAY_MS:200}
    outbox-relay-initial-delay-ms: ${CHAT_OUTBOX_RELAY_INITIAL_DELAY_MS:500}
    presence-refresh-ms: ${CHAT_PRESENCE_REFRESH_MS:10000}
    presence-ttl-seconds: ${CHAT_PRESENCE_TTL_SECONDS:30}
  geocoding:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_USER_AGENT:CinemaBooking/1.0}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  booking:
    seat-lock-ttl-minutes: ${BOOKING_SEAT_LOCK_TTL_MINUTES:1}
    expiration-reconciliation-delay-ms: ${BOOKING_EXPIRATION_RECONCILIATION_DELAY_MS:30000}
    expiration-reconciliation-initial-delay-ms: ${BOOKING_EXPIRATION_RECONCILIATION_INITIAL_DELAY_MS:10000}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    frontend-base-url: ${FRONTEND_URL}
  password-reset:
    otp-expiration-minutes: ${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:5}
    resend-delay-seconds: ${PASSWORD_RESET_RESEND_DELAY_SECONDS:60}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
