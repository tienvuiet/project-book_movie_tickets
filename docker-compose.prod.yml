name: ${COMPOSE_PROJECT_NAME:-cinema-booking}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
      - --table-open-cache=400
      - --performance-schema=OFF
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cinema_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.50
    pids_limit: 256
    stop_grace_period: 60s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --notify-keyspace-events Ex
        --maxmemory 64mb
        --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - cinema_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.15
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia%2FHo_Chi_Minh
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:?MAIL_APP_PASSWORD is required}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?PAYOS_CLIENT_ID is required}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?PAYOS_API_KEY is required}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?PAYOS_CHECKSUM_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      CHAT_OUTBOX_RELAY_DELAY_MS: ${CHAT_OUTBOX_RELAY_DELAY_MS:-200}
      CHAT_OUTBOX_RELAY_INITIAL_DELAY_MS: ${CHAT_OUTBOX_RELAY_INITIAL_DELAY_MS:-500}
      CHAT_PRESENCE_REFRESH_MS: ${CHAT_PRESENCE_REFRESH_MS:-10000}
      CHAT_PRESENCE_TTL_SECONDS: ${CHAT_PRESENCE_TTL_SECONDS:-30}
      BOOKING_SEAT_LOCK_TTL_MINUTES: ${BOOKING_SEAT_LOCK_TTL_MINUTES:-1}
      BOOKING_EXPIRATION_RECONCILIATION_DELAY_MS: ${BOOKING_EXPIRATION_RECONCILIATION_DELAY_MS:-30000}
      BOOKING_EXPIRATION_RECONCILIATION_INITIAL_DELAY_MS: ${BOOKING_EXPIRATION_RECONCILIATION_INITIAL_DELAY_MS:-10000}
      PASSWORD_RESET_OTP_EXPIRATION_MINUTES: ${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:-5}
      PASSWORD_RESET_RESEND_DELAY_SECONDS: ${PASSWORD_RESET_RESEND_DELAY_SECONDS:-60}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-CinemaBooking/1.0}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseContainerSupport -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom -Duser.timezone=Asia/Ho_Chi_Minh}
    expose:
      - "8080"
    networks:
      - cinema_internal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 75s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.60
    pids_limit: 256
    stop_grace_period: 45s
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - cinema_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.20
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

networks:
  cinema_internal:
    driver: bridge

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-cinema_booking_mysql_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-cinema_booking_redis_data}
